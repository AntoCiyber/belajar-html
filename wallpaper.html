<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surtr Arknights Live Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0d0101; /* Warna merah gelap pekat Arknights */
        }

        /* Container utama */
        .wallpaper-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* === Layer 1: Canvas Animasi Partikel === */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* Di belakang karakter */
        }

        /* === Layer 2: Gambar Karakter Surtr (Depan) === */
        .surtr-character {
            position: absolute;
            bottom: -50px; /* Posisi sedikit ke bawah agar kaki terpotong rapi */
            right: 5%;      /* Posisi di kanan layar */
            height: 110%;  /* Sangat besar agar mendominasi */
            z-index: 2;    /* Di depan canvas */
            pointer-events: none; /* Klik tembus ke canvas */
            
            /* Animasi Melayang Halus */
            animation: floating 8s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.5)); /* Glow biru di sekitar karakter */
        }

        /* Keyframes untuk animasi melayang */
        @keyframes floating {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

    </style>
</head>
<body>

    <div class="wallpaper-container">
        <!-- Canvas Latar -->
        <canvas id="particleCanvas"></canvas>

        <!-- Gambar Karakter (Gunakan PNG Transparan!) -->
        <img src="surtr-arknights.png" alt="Surtr Arknights" class="surtr-character">
    </div>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        const numberOfParticles = 80; // Dikurangi sedikit agar lebih dramatis

        // Atur ukuran canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init(); // Reset partikel saat resize
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Posisi mouse (diubah radiusnya agar lebih responsif di sekitar karakter)
        const mouse = {
            x: null,
            y: null,
            radius: 150
        };

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.clientX;
            mouse.y = event.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                // Partikel sedikit lebih besar
                this.size = Math.random() * 4 + 1; 
                this.speedX = (Math.random() - 0.5) * 1.0; 
                this.speedY = (Math.random() - 0.5) * 1.0; 
                // Warna partikel biru-cyan yang sama
                this.color = 'rgba(56, 189, 248, 0.8)'; 
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                if (this.x > canvas.width || this.x < 0) {
                    this.speedX = -this.speedX;
                }
                if (this.y > canvas.height || this.y < 0) {
                    this.speedY = -this.speedY;
                }

                // Interaksi mouse (partikel menghindar halus)
                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        this.x -= (dx / distance) * force * 2.5;
                        this.y -= (dy / distance) * force * 2.5;
                    }
                }

                this.x += this.speedX;
                this.y += this.speedY;
                this.draw();
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function connectParticles() {
            let maxDistance = 150; // Jarak koneksi sedikit lebih jauh
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < maxDistance) {
                        let opacity = 1 - (distance / maxDistance);
                        // Garis koneksi tipis dan sangat transparan
                        ctx.strokeStyle = `rgba(56, 189, 248, ${opacity * 0.2})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connectParticles();
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
